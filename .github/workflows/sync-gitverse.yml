name: Sync to GitVerse

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-gitverse
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure GitVerse SSH
        env:
          GITVERSE_SSH_KEY_B64: ${{ secrets.GITVERSE_SSH_KEY_B64 }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s' "$GITVERSE_SSH_KEY_B64" | base64 -d > ~/.ssh/gitverse
          chmod 600 ~/.ssh/gitverse

          ssh-keygen -y -f ~/.ssh/gitverse > /dev/null

          cat >> ~/.ssh/known_hosts <<'EOF'
          gitverse.ru ssh-rsa 
          EOF

      - name: Sync to GitVerse
        run: |
          git remote add gitverse git@gitverse.ru:keeneticported/KeeneticPorted.git

          git config core.sshCommand "ssh -i ~/.ssh/gitverse -o IdentitiesOnly=yes"

          git fetch gitverse main
          git push --force-with-lease gitverse HEAD:main