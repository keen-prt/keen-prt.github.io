name: Deploy VitePress site to Pages

on:
  push:
    branches: [main]

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build

    steps:
      - name: Checkout
        uses: https://gitverse.ru/actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: https://gitverse.ru/actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build with VitePress
        env:
          GITVERSE_PAGES: "true"
        run: npm run docs:build

      - name: Check build
        run: |
          echo "=== VitePress dist ==="
          ls -lah .vitepress/dist
          test -f .vitepress/dist/index.html

      - name: Upload Pages artifact
        uses: https://gitverse.ru/actions/upload-pages-artifact@v1.0.0
        with:
          path: .vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    name: Deploy

    steps:
      - name: Deploy to GitVerse Pages
        uses: https://gitverse.ru/actions/deploy-pages@v1.0.0